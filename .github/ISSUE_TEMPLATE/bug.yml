name: Bug report
description: Something harness-forge did wrong on your machine
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Claude Code version and OS
      placeholder: "2.1.292, Windows 11"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Paste the exact output. Remove anything private.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: state
    attributes:
      label: Wizard state
      description: Contents of `.wizard-state.json` with personal details removed, if the run got that far.
